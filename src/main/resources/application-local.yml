# 로컬 개발용 프로필. SPRING_PROFILES_ACTIVE=local 로 활성화.
# - SQL/시큐리티/도메인 로그를 자세히 출력
# - SQL 포맷팅 활성화
# 운영(profile 미지정) 에서는 application.yml 의 안전한 디폴트가 적용된다.

spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.springframework.security: DEBUG
    com.bank: DEBUG
