spring:
  application:
    name: concurrent-banking-api

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 앞단 Redisson 락이 대다수 요청을 빠르게 거절해 DB에 닿는 요청이 적다.
      # pool=30으로 실험했더니 오히려 동시 DB 트랜잭션이 늘어 MySQL 행락 경합이 커지고
      # TPS가 약 7% 하락했다(docs/loadtest/README.md 실험 1). 기본값과 동일한 10 유지.
      maximum-pool-size: 10
      minimum-idle: 10
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1740000
      leak-detection-threshold: 5000
      pool-name: HikariCP-Banking

  jpa:
    hibernate:
      # 운영 안전: 스키마는 Flyway 가 관리하고 ORM 은 검증만 한다.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    # 기존 ddl-auto=update 시절에 만들어진 로컬 DB 가 있을 경우를 대비해
    # 비어있지 않은 스키마에 대해서는 V1 을 baseline 으로 마킹하고 V2 부터 적용한다.
    # 신규 환경(빈 스키마)에서는 V1 부터 정상 적용된다.
    baseline-on-migrate: true
    baseline-version: 1

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

bank:
  transaction:
    limit:
      per-transaction: 10000000
      per-day: 50000000

logging:
  level:
    org.hibernate.SQL: debug
    org.springframework.security: DEBUG
    com.bank: DEBUG

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
