spring.datasource.url=jdbc:h2:mem:concurrent_banking;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 테스트는 H2 인메모리. Flyway 비활성화 후 Hibernate 가 스키마를 생성한다.
# (운영 마이그레이션 SQL 은 MySQL 전용 문법을 일부 사용하므로 H2 와는 분리.)
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

jwt.secret=test-256bit-secret-key-for-jwt-token-provider-1234
jwt.expiration=86400000

# 테스트에서 한도 검증이 실제로 걸리도록 낮은 값으로 오버라이드
bank.transaction.limit.per-transaction=1000
bank.transaction.limit.per-day=3000

