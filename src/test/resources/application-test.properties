spring.datasource.url=jdbc:h2:mem:banking;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

jwt.secret=test-256bit-secret-key-for-jwt-token-provider-1234
jwt.expiration=86400000

# 테스트에서 한도 검증이 실제로 걸리도록 낮은 값으로 오버라이드
bank.transaction.limit.per-transaction=1000
bank.transaction.limit.per-day=3000

